[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ouro-agents"
version = "0.1.0"
description = "Autonomous Agent Package for Ouro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uuid7-standard>=1.1.0",
    "smolagents[mcp]==1.24.0",
    "rich",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "jsonschema>=4.18",
    "apscheduler",
    "typer",
    "platformdirs",
    "mem0ai>=2.0.4",
    # Aligned with mem0 vector_stores extra; do not cap <1.0 — that downgrades vs existing on-disk data and breaks sysdb (KeyError: '_type').
    "chromadb>=0.4.24",
    "anthropic",
    "openai",
    "mcp",
    "textual",
    "ouro-mcp>=0.7.16",
    "ouro-py>=0.11.12",
]

[project.scripts]
ouro-agents = "ouro_agents.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
# Without this, a bare ``pytest`` walks the whole repo — including agent
# scratch/conversation-state trees and ``workspace/`` — and stalls in collection.
testpaths = ["tests"]
