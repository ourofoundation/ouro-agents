name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ourofoundation/ouro-agents-sandbox
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Make sandbox publicly pullable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            /orgs/ourofoundation/packages/container/ouro-agents-sandbox \
            -f visibility=public

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ouro-agents
    permissions:
      id-token: write
    steps:
      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check whether version already exists
        id: existing
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if curl --fail --silent "https://pypi.org/pypi/ouro-agents/${VERSION}/json" >/dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download distributions
        if: steps.existing.outputs.value != 'true'
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        if: steps.existing.outputs.value != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
